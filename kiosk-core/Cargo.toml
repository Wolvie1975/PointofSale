[package]
name = "kiosk-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Healing Hideaway kiosk booking logic: services, availability, bookings. No UI, no I/O."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
