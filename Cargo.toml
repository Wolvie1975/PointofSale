[package]
name = "pos"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace]
members = ["kiosk-core"]

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

